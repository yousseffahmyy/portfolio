<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visual Director & Photographer Portfolio">
    <title>Youssef Fahmy - Visual Director & Photographer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ========== DESIGN TOKENS ========== */
        :root {
            --bg-black: #000000;
            --bg-dark-gray: #121212;
            --bg-card: #1a1a1a;
            --text-white: #ffffff;
            --text-muted: #86868b;
            --text-light-gray: #a1a1a6;
            --border-subtle: #2c2c2e;
            --transition-smooth: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-fast: 0.3s ease-out;
        }

        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 0;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            font-weight: 300;
            overflow-x: hidden;
            letter-spacing: 0.3px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ========== TYPOGRAPHY ========== */
        .eyebrow {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            word-spacing: 0.1em;
        }

        .title-lg {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .title-md {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 600;
            line-height: 1.2;
        }

        /* ========== SECTIONS ========== */
        section {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            padding: clamp(3rem, 8vw, 5rem);
            background-color: var(--bg-black);
        }

        /* ========== HOME / SPLASH ========== */
        #home {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: clamp(2rem, 6vw, 4rem);
            align-items: stretch;
            min-height: 120vh;
            padding-top: clamp(2rem, 5vw, 3rem);
        }

        .hero-portrait {
            width: 100%;
            height: 100%;
            min-height: 70vh;
            background-color: var(--bg-dark-gray);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            position: relative;
        }

        .hero-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 3rem;
            padding: 2rem 0;
        }

        .hero-header {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .hero-name {
            font-size: clamp(3rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin: 0.5rem 0 0 0;
        }
