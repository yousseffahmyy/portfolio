<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visual Director & Photographer Portfolio - Cairo, Egypt">
    <title>Youssef Fahmy - Visual Director & Photographer</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ========== DESIGN TOKENS ========== */
        :root {
            --bg-black: #000000;
            --bg-dark-gray: #121212;
            --bg-card: #1a1a1a;
            --text-white: #ffffff;
            --text-muted: #86868b;
            --text-light-gray: #a1a1a6;
            --border-subtle: #2c2c2e;
            --transition-smooth: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-fast: 0.3s ease-out;
        }

        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 0;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            font-weight: 300;
            overflow-x: hidden;
            letter-spacing: 0.3px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ========== TYPOGRAPHY ========== */
        .eyebrow {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            word-spacing: 0.1em;
        }

        .title-lg {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .title-md {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 600;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: var(--text-light-gray);
        }

        /* ========== SECTIONS ========== */
        section {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            padding: clamp(3rem, 8vw, 5rem);
            background-color: var(--bg-black);
        }

        /* ========== HOME / SPLASH ========== */
        #home {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: clamp(2rem, 6vw, 4rem);
            align-items: stretch;
            min-height: 120vh;
            padding-top: clamp(2rem, 5vw, 3rem);
        }

        .hero-portrait {
            width: 100%;
            height: 100%;
            min-height: 70vh;
            background-color: var(--bg-dark-gray);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            position: relative;
        }

        .hero-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 3rem;
            padding: 2rem 0;
        }

        .hero-header {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .hero-name {
            font-size: clamp(3rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin: 0.5rem 0 0 0;
        }

        .hero-title {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .hero-location {
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        /* ========== NAVIGATION INDEX ========== */
        .portfolio-index {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .portfolio-index-item {
            display: block;
        }

        .portfolio-index-link {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.4rem, 2.5vw, 2rem);
            font-weight: 400;
            letter-spacing: -0.3px;
            color: var(--text-muted);
            transition: all var(--transition-fast);
            position: relative;
            display: inline-block;
            padding-bottom: 0.25rem;
        }

        .portfolio-index-link::before {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--text-white);
            transition: width var(--transition-fast);
        }

        .portfolio-index-link:hover {
            color: var(--text-white);
            transform: translateX(8px);
        }

        .portfolio-index-link:hover::before {
            width: 100%;
        }

        /* ========== PORTFOLIO SECTIONS ========== */
        .section-title {
            margin-bottom: clamp(2rem, 5vw, 3.5rem);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .section-title .eyebrow {
            margin-bottom: 0.5rem;
        }

        .section-title .title-md {
            color: var(--text-white);
        }

        /* ========== IMAGE GRID ========== */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: clamp(1.5rem, 3vw, 2.5rem);
            width: 100%;
        }

        .img-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            aspect-ratio: 3 / 4;
            position: relative;
            transition: all var(--transition-smooth);
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.8s ease-out;
        }

        .img-box:hover img {
            transform: scale(1.02);
        }

        /* COMMERCIAL GRID - ASYMMETRIC */
        #commercial .grid-item-1 {
            grid-column: span 7;
        }

        #commercial .grid-item-2 {
            grid-column: span 5;
            margin-top: 4rem;
        }

        #commercial .grid-item-3 {
            grid-column: span 5;
        }

        #commercial .grid-item-4 {
            grid-column: span 7;
            margin-top: 4rem;
        }

        /* FOOD & BEVERAGE GRID - BALANCED COLUMNS */
        #food-beverage .grid-item-1 {
            grid-column: span 4;
        }

        #food-beverage .grid-item-2 {
            grid-column: span 4;
            margin-top: 3rem;
        }

        #food-beverage .grid-item-3 {
            grid-column: span 4;
        }

        #food-beverage .grid-item-4 {
            grid-column: span 4;
            margin-top: 3rem;
        }

        #food-beverage .grid-item-5 {
            grid-column: span 4;
        }

        #food-beverage .grid-item-6 {
            grid-column: span 4;
            margin-top: 3rem;
        }

        /* EVENTS GRID - MIXED LANDSCAPE/PORTRAIT */
        #events .grid-item-1 {
            grid-column: span 5;
            aspect-ratio: 4 / 5;
        }

        #events .grid-item-2 {
            grid-column: span 7;
            aspect-ratio: 16 / 10;
            margin-top: 0;
        }

        #events .grid-item-3 {
            grid-column: span 7;
            aspect-ratio: 16 / 10;
        }

        #events .grid-item-4 {
            grid-column: span 5;
            aspect-ratio: 4 / 5;
            margin-top: 2rem;
        }

        /* ========== BACK TO TOP / FLOATING NAV ========== */
        .back-to-top {
            position: fixed;
            bottom: clamp(1.5rem, 3vw, 2.5rem);
            right: clamp(1.5rem, 3vw, 2.5rem);
            background-color: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            color: var(--text-white);
            padding: 0.75rem 1.2rem;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            z-index: 999;
            cursor: pointer;
            transition: all var(--transition-fast);
            opacity: 0;
            pointer-events: none;
        }

        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .back-to-top:hover {
            background-color: rgba(18, 18, 18, 0.95);
            border-color: var(--text-white);
            padding-right: 1.4rem;
        }

        .back-to-top::after {
            content: ' ↑';
            margin-left: 0.3rem;
        }

        /* ========== SCROLL OBSERVER ANIMATIONS ========== */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .img-box {
            animation: fadeInUp 0.8s ease-out both;
        }

        .img-box:nth-child(1) { animation-delay: 0.1s; }
        .img-box:nth-child(2) { animation-delay: 0.2s; }
        .img-box:nth-child(3) { animation-delay: 0.3s; }
        .img-box:nth-child(4) { animation-delay: 0.4s; }
        .img-box:nth-child(5) { animation-delay: 0.5s; }
        .img-box:nth-child(6) { animation-delay: 0.6s; }

        /* ========== RESPONSIVE DESIGN ========== */
        @media (max-width: 1024px) {
            #home {
                grid-template-columns: 1fr;
                min-height: auto;
                gap: 2rem;
            }

            .hero-portrait {
                min-height: 50vh;
            }

            #commercial .grid-item-1,
            #commercial .grid-item-2,
            #commercial .grid-item-3,
            #commercial .grid-item-4 {
                grid-column: span 12 !important;
                margin-top: 0 !important;
            }

            #food-beverage .grid-item-1,
            #food-beverage .grid-item-2,
            #food-beverage .grid-item-3,
            #food-beverage .grid-item-4,
            #food-beverage .grid-item-5,
            #food-beverage .grid-item-6 {
                grid-column: span 12 !important;
                margin-top: 0 !important;
            }

            #events .grid-item-1,
            #events .grid-item-2,
            #events .grid-item-3,
            #events .grid-item-4 {
                grid-column: span 12 !important;
                margin-top: 0 !important;
                aspect-ratio: 3 / 4 !important;
            }

            .portfolio-index-link {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 768px) {
            section {
                padding: 2rem 1.5rem;
                min-height: auto;
            }

            .hero-content {
                gap: 2rem;
            }

            .image-grid {
                gap: 1.2rem;
            }

            .hero-name {
                font-size: 2.2rem;
            }

            .portfolio-index {
                gap: 1.2rem;
            }

            .portfolio-index-link {
                font-size: 1.1rem;
            }

            .title-md {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            section {
                padding: 1.5rem 1rem;
            }

            .hero-name {
                font-size: 1.8rem;
            }

            .hero-title {
                font-size: 0.8rem;
            }

            .eyebrow {
                font-size: 0.7rem;
            }

            .portfolio-index-link {
                font-size: 1rem;
            }

            .back-to-top {
                padding: 0.6rem 0.9rem;
                font-size: 0.7rem;
            }
        }

        /* ========== REDUCED MOTION ========== */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- FLOATING BACK TO TOP -->
    <a href="#home" class="back-to-top" id="backToTop">Index</a>

    <!-- ========== HOME / SPLASH ========== -->
    <section id="home">
        <div class="hero-portrait">
            <img src="portrait.jpg" alt="Youssef Fahmy - Portrait">
        </div>
        <div class="hero-content">
            <div class="hero-header">
                <p class="eyebrow">Visual Director / Photographer</p>
                <h1 class="hero-name">Youssef<br>Fahmy</h1>
                <p class="hero-location">Based in Cairo, Egypt</p>
            </div>
            <nav class="portfolio-index">
                <li class="portfolio-index-item">
                    <a href="#commercial" class="portfolio-index-link">01. Commercial Ads</a>
                </li>
                <li class="portfolio-index-item">
                    <a href="#food-beverage" class="portfolio-index-link">02. Food & Beverage</a>
                </li>
                <li class="portfolio-index-item">
                    <a href="#events" class="portfolio-index-link">03. Events Attended</a>
                </li>
            </nav>
        </div>
    </section>

    <!-- ========== COMMERCIAL ADS ========== -->
    <section id="commercial">
        <div class="section-title">
            <span class="eyebrow">Portfolio</span>
            <h2 class="title-md">01. Commercial Ads</h2>
        </div>
        <div class="image-grid">
            <div class="img-box grid-item-1">
                <img src="commercial1.jpg" alt="Commercial project 1">
            </div>
            <div class="img-box grid-item-2">
                <img src="commercial2.jpg" alt="Commercial project 2">
            </div>
            <div class="img-box grid-item-3">
                <img src="commercial3.jpg" alt="Commercial project 3">
            </div>
            <div class="img-box grid-item-4">
                <img src="commercial4.jpg" alt="Commercial project 4">
            </div>
        </div>
    </section>

    <!-- ========== FOOD & BEVERAGE ========== -->
    <section id="food-beverage">
        <div class="section-title">
            <span class="eyebrow">Editorial</span>
            <h2 class="title-md">02. Food & Beverage</h2>
        </div>
        <div class="image-grid">
            <div class="img-box grid-item-1">
                <img src="food1.jpg" alt="Food & beverage 1">
            </div>
            <div class="img-box grid-item-2">
                <img src="food2.jpg" alt="Food & beverage 2">
            </div>
            <div class="img-box grid-item-3">
                <img src="food3.jpg" alt="Food & beverage 3">
            </div>
            <div class="img-box grid-item-4">
                <img src="food4.jpg" alt="Food & beverage 4">
            </div>
            <div class="img-box grid-item-5">
                <img src="food5.jpg" alt="Food & beverage 5">
            </div>
            <div class="img-box grid-item-6">
                <img src="food6.jpg" alt="Food & beverage 6">
            </div>
        </div>
    </section>

    <!-- ========== EVENTS ========== -->
    <section id="events">
        <div class="section-title">
            <span class="eyebrow">Coverage</span>
            <h2 class="title-md">03. Events Attended</h2>
        </div>
        <div class="image-grid">
            <div class="img-box grid-item-1">
                <img src="event1.jpg" alt="Event coverage 1">
            </div>
            <div class="img-box grid-item-2">
                <img src="event2.jpg" alt="Event coverage 2">
            </div>
            <div class="img-box grid-item-3">
                <img src="event3.jpg" alt="Event coverage 3">
            </div>
            <div class="img-box grid-item-4">
                <img src="event4.jpg" alt="Event coverage 4">
            </div>
        </div>
    </section>

    <!-- SMOOTH SCROLL & FLOATING NAV SCRIPT -->
    <script>
        // Back to Top visibility toggle
        const backToTopBtn = document.getElementById('backToTop');
        
        window.addEventListener('scroll', () => {
            if (window.scrollY > window.innerHeight * 0.5) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        // Smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Image lazy loading enhancement
        if ('IntersectionObserver' in window) {
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        observer.unobserve(entry.target);
                    }
                });
            });

            document.querySelectorAll('.img-box img').forEach(img => {
                imageObserver.observe(img);
            });
        }
    </script>
</body>
</html>
